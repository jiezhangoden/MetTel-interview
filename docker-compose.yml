services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic network-events --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic network-incidents --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --list

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  vendor-api:
    build:
      context: ./vendor-api/src/VendorApi
    ports:
      - "8080:8080"
    environment:
      VENDOR_DELAY_SCALE: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  jobmanager:
    image: flink:1.20.1-java17
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0

  taskmanager:
    image: flink:1.20.1-java17
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2

  flink-job:
    build: ./flink-job
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
    environment:
      FLINK_REST: jobmanager:8081
      KAFKA_BOOTSTRAP: kafka:9093
      NETWORK_EVENTS_TOPIC: network-events
      NETWORK_INCIDENTS_TOPIC: network-incidents
    restart: "no"

  dagster-webserver:
    build: ./dagster
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    ports:
      - "3000:3000"
    environment: &dagster_env
      VENDOR_API_BASE: http://vendor-api:8080
      KAFKA_BOOTSTRAP: kafka:9093
      NETWORK_EVENTS_TOPIC: network-events
      NETWORK_INCIDENTS_TOPIC: network-incidents
    volumes:
      - ./dagster/sdwan_orchestration:/opt/dagster/app/sdwan_orchestration
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      vendor-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  dagster-daemon:
    build: ./dagster
    command: ["dagster-daemon", "run", "-w", "workspace.yaml"]
    environment: *dagster_env
    volumes:
      - ./dagster/sdwan_orchestration:/opt/dagster/app/sdwan_orchestration
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      vendor-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  dagster_home:
